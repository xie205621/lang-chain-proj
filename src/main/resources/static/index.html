<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智 - 数码产品导购</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --bg: #f8fafc;
            --sidebar-bg: #1e1b4b;
            --sidebar-hover: #312e81;
            --user-bubble: #4f46e5;
            --ai-bubble: #ffffff;
            --ai-border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #64748b;
            --input-bg: #ffffff;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            color: var(--text);
            overflow: hidden;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .sidebar-header .logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 700;
        }
        .sidebar-header .logo .icon { font-size: 28px; }
        .sidebar-header .subtitle { font-size: 12px; color: #a5b4fc; margin-top: 4px; }

        .sidebar-conversations {
            flex: 1; overflow-y: auto; padding: 12px;
        }
        .sidebar-conversations .label {
            font-size: 11px; text-transform: uppercase;
            color: #a5b4fc; padding: 8px 12px; letter-spacing: 1px;
        }
        .conv-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            margin-bottom: 2px; font-size: 14px;
            transition: background .15s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .conv-item:hover { background: var(--sidebar-hover); }
        .conv-item.active { background: var(--primary); }

        .sidebar-footer {
            padding: 16px; border-top: 1px solid rgba(255,255,255,.1);
        }
        .new-chat-btn {
            width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px; background: transparent; color: #fff;
            font-size: 14px; cursor: pointer;
            transition: all .2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .new-chat-btn:hover { background: var(--sidebar-hover); border-color: #fff; }
        .delete-chat-btn {
            width: 100%; margin-top: 8px; padding: 8px;
            border: none; border-radius: 6px;
            background: rgba(239,68,68,.2); color: #fca5a5;
            font-size: 12px; cursor: pointer; transition: all .2s;
        }
        .delete-chat-btn:hover { background: rgba(239,68,68,.4); color: #fecaca; }

        /* ========== 主区域 ========== */
        .main {
            flex: 1; display: flex; flex-direction: column;
            min-width: 0;
        }

        /* 顶栏 */
        .topbar {
            padding: 14px 24px; background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar .title { font-weight: 600; font-size: 16px; }
        .topbar .status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

        /* 聊天区域 */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .chat-area .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-secondary); gap: 12px;
        }
        .empty-state .big-icon { font-size: 64px; }
        .empty-state h2 { font-size: 24px; color: var(--text); }
        .empty-state .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; max-width: 500px; }
        .hint-chip {
            padding: 8px 16px; border: 1px solid #e2e8f0;
            border-radius: 20px; font-size: 13px; cursor: pointer;
            background: #fff; transition: all .2s;
        }
        .hint-chip:hover { border-color: var(--primary); color: var(--primary); }

        /* 消息气泡 */
        .message { display: flex; gap: 12px; animation: fadeIn .3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .message.ai .avatar { background: #eef2ff; }
        .message.user .avatar { background: var(--primary); }
        .message .bubble {
            max-width: 75%; padding: 12px 18px; border-radius: 16px;
            font-size: 15px; line-height: 1.65;
            word-break: break-word;
        }
        .message.ai .bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--ai-border);
            border-top-left-radius: 4px;
            box-shadow: var(--shadow);
        }
        .message.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-top-right-radius: 4px;
        }
        /* Markdown inside AI bubble */
        .message.ai .bubble p { margin: 4px 0; }
        .message.ai .bubble strong { color: #1e293b; }
        .message.ai .bubble table {
            border-collapse: collapse; width: 100%; margin: 8px 0;
            font-size: 13px;
        }
        .message.ai .bubble th, .message.ai .bubble td {
            border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left;
        }
        .message.ai .bubble th { background: #f1f5f9; font-weight: 600; }
        .message.ai .bubble h1,.message.ai .bubble h2,.message.ai .bubble h3 {
            margin: 8px 0 4px;
        }
        .message.ai .bubble hr { border: none; border-top: 1px solid #e2e8f0; margin: 10px 0; }
        .message.ai .bubble code {
            background: #f1f5f9; padding: 1px 4px; border-radius: 3px;
            font-size: 13px;
        }
        .message.ai .bubble pre {
            background: #1e1b4b; color: #e2e8f0; padding: 12px;
            border-radius: 8px; overflow-x: auto; font-size: 13px;
        }
        .message.ai .bubble pre code { background: none; color: inherit; }

        .typing-cursor::after {
            content: '▊'; animation: blink 1s infinite; color: var(--primary);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* 输入区 */
        .input-area {
            padding: 16px 24px; background: #fff; border-top: 1px solid #e2e8f0;
        }
        .input-wrapper {
            display: flex; gap: 10px; align-items: flex-end;
            background: var(--bg); border: 1px solid #e2e8f0;
            border-radius: 16px; padding: 8px 8px 8px 18px;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.1);
        }
        .input-wrapper textarea {
            flex: 1; border: none; background: transparent;
            resize: none; outline: none; font-size: 15px;
            font-family: inherit; line-height: 1.5;
            max-height: 120px; padding: 6px 0;
        }
        .input-wrapper .send-btn {
            width: 40px; height: 40px; border: none;
            border-radius: 12px; background: var(--primary);
            color: #fff; font-size: 18px; cursor: pointer;
            transition: all .2s; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .input-wrapper .send-btn:hover { background: var(--primary-light); }
        .input-wrapper .send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .input-hint { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 6px; }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message .bubble { max-width: 90%; }
        }
    </style>
</head>
<body>

<!-- ========== 侧边栏 ========== -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo"><span class="icon">🤖</span>小智</div>
        <div class="subtitle">数码产品导购助手</div>
    </div>
    <div class="sidebar-conversations" id="conversationList">
        <div class="label">历史对话</div>
    </div>
    <div class="sidebar-footer">
        <button class="new-chat-btn" onclick="newChat()">＋ 新建对话</button>
        <button class="delete-chat-btn" onclick="deleteCurrentChat()">🗑 删除当前对话</button>
    </div>
</aside>

<!-- ========== 主区域 ========== -->
<main class="main">
    <div class="topbar">
        <span class="title" id="chatTitle">新对话</span>
        <span class="status"><span class="status-dot"></span>在线</span>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="empty-state">
            <div class="big-icon">📱</div>
            <h2>你好！我是小智</h2>
            <p>你的数码产品导购助手，主营手机、笔记本、耳机、键盘、鼠标</p>
            <div class="hints">
                <span class="hint-chip" onclick="sendHint('我想买一副300元以内的蓝牙耳机')">🔍 搜索蓝牙耳机</span>
                <span class="hint-chip" onclick="sendHint('预算5000，推荐一款适合办公的笔记本')">💻 推荐办公笔记本</span>
                <span class="hint-chip" onclick="sendHint('帮我对比一下iPhone 15各平台价格')">📊 比价 iPhone 15</span>
                <span class="hint-chip" onclick="sendHint('蓝牙耳机买回来不喜欢可以退吗？')">💬 售后政策咨询</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1"
                placeholder="输入您的问题，例如：我想买一副蓝牙耳机..."
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">➤</button>
        </div>
        <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
    </div>
</main>

<script>
    // ==================== 状态管理 ====================
    const STORAGE_KEY = 'xiaozhi_conversations';
    const USER_ID_KEY = 'xiaozhi_persistent_user_id';
    let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let currentConvId = null;
    let isStreaming = false;

    // 持久化用户标识：首次生成后永远不变（清浏览器缓存才重置）
    function getPersistentUserId() {
        let uid = localStorage.getItem(USER_ID_KEY);
        if (!uid) {
            uid = 'uid-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem(USER_ID_KEY, uid);
        }
        return uid;
    }

    // 初始化：加载或创建对话
    function init() {
        const ids = Object.keys(conversations);
        if (ids.length > 0) {
            currentConvId = ids[ids.length - 1];
            loadConversation(currentConvId);
        } else {
            newChat();
        }
        renderConversationList();
    }

    // AI 问候语（与系统提示词一致）
    const AI_GREETING = '您好！我是小智，您的数码产品导购助手 📱💻，主营手机、笔记本、耳机、键盘、鼠标，可以帮您搜索比价、推荐好物、下单查订单，请问有什么可以帮您的？😊';

    // 新建对话
    function newChat() {
        const convId = Date.now().toString();
        conversations[convId] = {
            title: '新对话',
            messages: [
                { role: 'ai', content: AI_GREETING }
            ],
            memoryId: Number(convId),   // Long 型数字
            createdAt: new Date().toISOString()
        };
        currentConvId = convId;
        saveAndRender();
        loadConversation(currentConvId);
    }

    // 加载对话
    function loadConversation(convId) {
        currentConvId = convId;
        const conv = conversations[convId];
        if (!conv) return;
        document.getElementById('chatTitle').textContent = conv.title || '新对话';
        const chatArea = document.getElementById('chatArea');
        chatArea.innerHTML = '';

        if (!conv.messages || conv.messages.length === 0) {
            chatArea.innerHTML = getEmptyStateHTML();
        } else {
            conv.messages.forEach((m, i) => {
                appendBubble(m.role, m.content, i === conv.messages.length - 1 && m.role === 'ai');
            });
        }
        chatArea.scrollTop = chatArea.scrollHeight;
        renderConversationList();
    }

    function getEmptyStateHTML() {
        return `
        <div class="empty-state">
            <div class="big-icon">📱</div>
            <h2>你好！我是小智</h2>
            <p>你的数码产品导购助手，主营手机、笔记本、耳机、键盘、鼠标</p>
            <div class="hints">
                <span class="hint-chip" onclick="sendHint('我想买一副300元以内的蓝牙耳机')">🔍 搜索蓝牙耳机</span>
                <span class="hint-chip" onclick="sendHint('预算5000，推荐一款适合办公的笔记本')">💻 推荐办公笔记本</span>
                <span class="hint-chip" onclick="sendHint('帮我对比一下iPhone 15各平台价格')">📊 比价 iPhone 15</span>
                <span class="hint-chip" onclick="sendHint('蓝牙耳机买回来不喜欢可以退吗？')">💬 售后政策咨询</span>
            </div>
        </div>`;
    }

    // 删除当前对话
    function deleteCurrentChat() {
        if (!confirm('确定要删除当前对话吗？此操作不可恢复。')) return;
        delete conversations[currentConvId];
        const ids = Object.keys(conversations);
        if (ids.length === 0) {
            newChat();
        } else {
            currentConvId = ids[ids.length - 1];
            loadConversation(currentConvId);
        }
        saveAndRender();
    }

    // 保存 & 刷新侧边栏
    function saveAndRender() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        renderConversationList();
        document.getElementById('chatTitle').textContent =
            (conversations[currentConvId] && conversations[currentConvId].title) || '新对话';
    }

    function renderConversationList() {
        const list = document.getElementById('conversationList');
        const ids = Object.keys(conversations).sort((a,b) => b - a);
        let html = '<div class="label">历史对话</div>';
        if (ids.length === 0) {
            html += '<div style="padding:12px;color:#a5b4fc;font-size:13px;">暂无历史对话</div>';
        } else {
            ids.forEach(id => {
                const conv = conversations[id];
                const title = conv.title || '新对话';
                const active = id === currentConvId ? ' active' : '';
                html += `<div class="conv-item${active}" onclick="loadConversation('${id}')" title="${escapeHtml(title)}">💬 ${escapeHtml(title)}</div>`;
            });
        }
        list.innerHTML = html;
    }

    // ==================== 消息发送 ====================
    function sendHint(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    async function sendMessage() {
        if (isStreaming) return;
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        const conv = conversations[currentConvId];
        if (!conv) return;

        // 清除空状态
        const emptyEl = document.querySelector('.empty-state');
        if (emptyEl) emptyEl.remove();

        // 更新标题
        if (!conv.title || conv.title === '新对话') {
            conv.title = text.length > 20 ? text.substring(0, 20) + '…' : text;
        }

        // 显示用户消息
        conv.messages.push({ role: 'user', content: text });
        appendBubble('user', text);
        saveAndRender();

        // 清空输入
        input.value = '';
        input.style.height = 'auto';
        document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

        // 发送请求
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;

        // 创建 AI 消息占位 + loading 动画
        const aiBubble = createStreamingBubble();
        let aiContent = '';

        try {
            const persistentUserId = getPersistentUserId();
            console.log('🚀 发送请求 /shop/chat, payload:', { memoryId: conv.memoryId, userId: persistentUserId, message: text });

            const response = await fetch('/shop/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    memoryId: conv.memoryId,
                    message: text,
                    userId: persistentUserId
                })
            });

            console.log('📡 响应状态:', response.status, 'Content-Type:', response.headers.get('Content-Type'));

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let leftover = '';    // 跨块未完成的行
            let detectedSSE = null; // null=未知, true=SSE, false=纯文本

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const raw = decoder.decode(value, { stream: true });
                leftover += raw;

                // === 第一次收到数据：检测格式 ===
                if (detectedSSE === null) {
                    detectedSSE = leftover.trimStart().startsWith('data:');
                    console.log('🔍 检测响应格式:', detectedSSE ? 'SSE (data:xxx)' : '纯文本流');
                }

                if (detectedSSE) {
                    // === SSE 格式：按行解析 data: ===
                    const lines = leftover.split('\n');
                    leftover = lines.pop() || '';   // 不完整的行留到下次

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            let chunk = line.substring(5);
                            if (chunk.startsWith(' ')) chunk = chunk.substring(1);
                            if (chunk.trim() !== '') {
                                aiContent += chunk;
                            }
                        }
                    }
                } else {
                    // === 纯文本：直接拼接 ===
                    aiContent += leftover;
                    leftover = '';
                }

                updateStreamingBubble(aiBubble, aiContent);
            }

            // 处理残留的不完整行
            if (leftover.length > 0) {
                if (detectedSSE && leftover.startsWith('data:')) {
                    let chunk = leftover.substring(5);
                    if (chunk.startsWith(' ')) chunk = chunk.substring(1);
                    if (chunk.trim() !== '') aiContent += chunk;
                } else if (!detectedSSE) {
                    aiContent += leftover;
                }
                updateStreamingBubble(aiBubble, aiContent);
            }

            console.log('✅ 流式响应完成，总长度:', aiContent.length);

        } catch (err) {
            console.error('❌ 请求失败:', err);
            updateStreamingBubble(aiBubble, aiContent || '😔 抱歉，请求出错了：' + err.message);
        }

        // 完成：去掉光标，保存
        aiBubble.querySelector('.bubble').classList.remove('typing-cursor');
        conv.messages.push({ role: 'ai', content: aiContent || '（空回复）' });

        isStreaming = false;
        document.getElementById('sendBtn').disabled = false;
        saveAndRender();
        document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    }

    // ==================== UI 辅助 ====================
    function appendBubble(role, content, isLastAi) {
        const chatArea = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        const avatar = role === 'ai' ? '🤖' : '👤';
        const cls = isLastAi ? 'bubble typing-cursor' : 'bubble';
        div.innerHTML = `<div class="avatar">${avatar}</div><div class="${cls}">${simpleMarkdown(content)}</div>`;
        chatArea.appendChild(div);
    }

    function createStreamingBubble() {
        const chatArea = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'message ai';
        div.innerHTML = `<div class="avatar">🤖</div><div class="bubble typing-cursor"></div>`;
        chatArea.appendChild(div);
        return div;
    }

    function updateStreamingBubble(element, content) {
        element.querySelector('.bubble').innerHTML = simpleMarkdown(content);
        const chatArea = document.getElementById('chatArea');
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function simpleMarkdown(text) {
        if (!text) return '';
        let html = escapeHtml(text);
        // 粗体 **text**
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // 表格识别：连续的 | ... | ... | 行
        if (html.includes('|')) {
            html = html.replace(/(\|[^|]+\|[\s\S]*?)(?=\n\n|$)/g, (match) => {
                const rows = match.trim().split('\n').filter(r => r.includes('|'));
                if (rows.length < 2) return match;
                let table = '<table>';
                rows.forEach((row, i) => {
                    const cells = row.split('|').filter(c => c.trim() !== '');
                    const tag = i === 1 && cells.every(c => /^[-: ]+$/.test(c.trim())) ? '' : (i === 0 || (i === 1 && rows[1] && rows[1].includes('--'))) ? 'th' : 'td';
                    if (tag === '' && i === 1 && rows[1] && rows[1].includes('--')) return; // 跳过分隔行
                    table += '<tr>';
                    cells.forEach(c => {
                        const actualTag = i === 0 ? 'th' : 'td';
                        table += `<${actualTag}>${c.trim()}</${actualTag}>`;
                    });
                    table += '</tr>';
                });
                table += '</table>';
                return table;
            });
        }
        // 换行
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, c => map[c]);
    }

    // ==================== 输入处理 ====================
    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ==================== 初始化 ====================
    init();
</script>

</body>
</html>
